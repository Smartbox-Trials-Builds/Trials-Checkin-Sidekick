<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Device Sidekick</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="panel.css" />
  <link rel="stylesheet" href="themes.css" />
</head>
<body class="device-window">
  <div class="container pre-prep-view" id="prePrepView" >
    <div class="device-sidekick-heading"><h1>Device Sidekick</h1></div>
    <p class="complete-intro">Add devices to the wipe list using scanned device numbers or internal serial numbers.</p>

    <div class="device-mode-picker">
      <button id="internalSerialOnlyBtn" class="toggle-btn" type="button" aria-pressed="false">Internal serial only: Off</button>
    </div>

    <form id="prePrepScanForm" class="lookup-form">
      <label for="prePrepScanInput">Device serial number</label>
      <input type="text" id="prePrepScanInput" placeholder="Scan or type the device serial number" required />
      <button type="submit" id="prePrepAddBtn">Add device</button>
      <div class="lookup-meta" id="deviceScanDetails">
        <div>
          <div class="lookup-meta__label">Last raw scan</div>
          <div id="prePrepRawScan" class="lookup-meta__value">—</div>
        </div>
        <div>
          <div class="lookup-meta__label">Corrected serial</div>
          <div id="prePrepCorrectedScan" class="lookup-meta__value">—</div>
        </div>
      </div>
    </form>
    <form id="internalSerialForm" class="lookup-form" hidden>
      <label for="internalSerialInput">Internal serial number</label>
      <input type="text" id="internalSerialInput" placeholder="Enter an internal serial number" required />
      <button type="submit" id="addInternalSerialBtn">Add device</button>
    </form>
    <div id="prePrepStatus" class="status-line" role="status" aria-live="polite"></div>

    <div class="mini-row pre-prep-actions">
      <button id="beginWipeBtn" class="toggle-btn" type="button" hidden>Begin Wipe</button>
      <button id="beginAddingProfilesBtn" class="toggle-btn" type="button" hidden>Begin Adding Profiles</button>
      <button id="prePrepLockBtn" class="toggle-btn" type="button">Lock edits: Off</button>
      <button id="prePrepClearBtn" class="toggle-btn" type="button">Clear list</button>
    </div>

    <div class="note-preview pre-prep-list-card">
      <div class="note-preview__title">Device wipe list</div>
      <div class="pre-prep-table" id="deviceSidekickTable" data-mode="wipe" role="table" aria-label="Device and internal serial list">
        <div class="pre-prep-table__header" role="row">
          <div role="columnheader" id="deviceSerialHeading">Scanned device numbers</div>
          <div role="columnheader">Internal serial numbers</div>
          <div role="columnheader">Device category</div>
          <div class="device-row-actions-heading" role="columnheader" aria-label="Row actions">Actions</div>
        </div>
        <div id="prePrepRows" class="pre-prep-table__body"></div>
      </div>
      <p id="prePrepEmptyState" class="hint-text">No devices added yet.</p>
    </div>


  </div>

<script src="workers/window-theme.js"></script>
<script src="workers/serial-utils.js"></script>
<script src="workers/device-sidekick.js"></script>
</body>
</html>
