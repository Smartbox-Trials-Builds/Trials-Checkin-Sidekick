<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sidekick — Live Queue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="panel.css" />
  <link rel="stylesheet" href="themes.css" />
</head>
<body class="queue-window" style="visibility:hidden;">
  <main class="container">
    <section id="coordinatorQueueSection" aria-labelledby="coordinatorQueueTitle">
      <div class="queue-heading">
        <h2 id="coordinatorQueueTitle">Device Prep Queue</h2>
        <button id="returnCoordinatorQueueBtn" class="toggle-btn queue-small-btn" type="button">Close queue</button>
      </div>
      <p class="hint-text">Move this window by its title bar. Drag an edge to resize.</p>
      <div id="queueWindowStatus" class="status-line" role="status"></div>
      <div id="coordinatorQueueBody">
        <div class="queue-actions queue-membership-controls">
          <button id="joinCoordinatorQueueBtn" class="toggle-btn queue-small-btn queue-membership-btn" type="button" title="Open daily 7 AM–8 PM Central time (including daylight saving). Queue clears at 8 PM." disabled>Join Queue</button>
<button id="assignDevicesBtn" class="toggle-btn queue-small-btn" type="button" hidden>Assign Devices</button><button id="copyAssignedInitialsBtn" class="toggle-btn queue-small-btn" type="button" hidden>Assignment log</button>
              <span id="coordinatorQueueIndicator" class="queue-status-light" data-state="disconnected" role="status" aria-label="Queue connecting" title="Queue connecting"></span>
        </div>
        <p id="coordinatorQueueStatus" class="hint-text queue-error-status" role="status"></p>
        <ol id="coordinatorQueueList" class="coordinator-queue__list" aria-label="Active queue"></ol>
      </div>
    </section>
  </main>
  <dialog id="prepAssignmentDialog" class="prep-assignment-dialog" aria-labelledby="prepAssignmentTitle">
    <form id="prepAssignmentForm">
      <h2 id="prepAssignmentTitle">Assign Devices</h2>
      <label for="prepAssignmentCount">How many devices?</label>
      <input id="prepAssignmentCount" type="number" min="1" max="10" step="1" value="1" required />
      <p class="hint-text">Assign the next available users in queue order. Their initials will be copied as separate Excel rows.</p>
      <p id="prepAssignmentStatus" class="status-line" role="status"></p>
      <div class="queue-actions"><button id="prepAssignmentSubmit" type="submit">Assign</button><button id="prepAssignmentCancel" class="toggle-btn" type="button">Cancel</button></div>
    </form>
  </dialog>
  <script src="workers/window-theme.js"></script>
  <script src="libs/supabase.min.js"></script>
  <script src="workers/supabase-connection.js"></script>
  <script src="workers/queue-layout.js"></script>
  <script src="workers/queue-beta-window.js"></script>
  <script src="workers/queue.js"></script>
</body>
</html>
